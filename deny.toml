[advisories]
unmaintained = "workspace"
ignore       = []

[licenses]
# Anticipatory: what is acceptable, not what is present. GPL/AGPL/SSPL/BUSL/ODbL
# stay out by omission.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold   = 0.8
unused-allowed-license = "allow"
private                = { ignore = true }

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true  # a path dep carries no version and reads as one
deny                 = []

# Without this table the check reports `sources ok` having done nothing.
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
