name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Cargo registry & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The devshell exports RUSTFMT, so this resolves the pinned nightly. On
      # stable the nightly-only options would be ignored and this would pass.
      - name: Format
        run: nix develop -c cargo fmt --all -- --check

      # Prose wraps at 80; tables are exempt because markdown cannot wrap cells.
      - name: Format (markdown)
        run: nix develop -c prettier --check "**/*.md"

      # No `-D warnings`: levels are set in Cargo.toml, so the CI verdict and the
      # local verdict are the same.
      - name: Clippy
        run: nix develop -c cargo clippy --workspace --all-targets --locked

      # `--no-tests=pass` only while the crate is empty. Remove it with the first
      # real test: nextest failing on zero tests is the check working.
      - name: Test
        run: nix develop -c cargo nextest run --workspace --locked --no-tests=pass

      # nextest does not run doc tests.
      - name: Doctests
        run: nix develop -c cargo test --doc --workspace --locked

      # Without this every `[lints.rustdoc]` entry is inert.
      - name: Docs
        run: nix develop -c cargo doc -p time_value --no-deps --locked

      - name: Deny
        run: nix develop -c cargo deny check all
