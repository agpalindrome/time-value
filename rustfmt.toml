# Everything below `newline_style` is nightly-only and silently ignored on
# stable. `flake.nix` sets `RUSTFMT` to the pinned nightly binary.
max_width                = 100
newline_style            = "Unix"
use_field_init_shorthand = true

group_imports                = "StdExternalCrate"
imports_granularity          = "Crate"
wrap_comments                = true
comment_width                = 80
format_code_in_doc_comments  = true
doc_comment_code_block_width = 80
