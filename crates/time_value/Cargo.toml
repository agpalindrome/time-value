[package]
name        = "time_value"
description = "Type-safe time-value-of-money calculations"
# Versioning is deferred: this is a rewrite, developed continuously, and cutting
# a release is the owner's call. The published `0.1.0`–`0.8.0` series is a
# separate, immutable history that this line does not continue.
version    = "0.0.0"
readme     = "README.md"
keywords   = ["finance", "tvm", "interest", "present-value"]
categories = ["finance", "mathematics", "no-std"]

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

# Load-bearing. Without it this crate gets *none* of the workspace lint
# configuration and silently falls back to clippy's defaults.
[lints]
workspace = true
