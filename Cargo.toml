[workspace]
# Required: a virtual workspace does not infer the resolver from its members and
# silently defaults to 1.
resolver = "3"
members = ["crates/bundle-check", "crates/time-value-cli", "crates/time_value"]

[workspace.package]
edition      = "2024"
rust-version = "1.97"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/ojhermann-org/time-value"

# Dependencies arrive when something needs them, never in advance.
[workspace.dependencies]
# Reads the bundle: concepts keyed by id, the spec's own conformance findings,
# and timestamps as values rather than strings. It is the same `okf-graph` that
# ran as a nix-provided binary until 2026-08-08, taken as a crate so its version
# is pinned in Cargo.lock beside everything else rather than in flake.lock.
#
# Pre-1.0, and its own changelog says a minor bump may break the API — so `0.1`
# rather than a looser range, and its `#[non_exhaustive]` types are matched with
# a wildcard arm rather than exhaustively.
okf-graph = "0.1"

# The library, for the binaries that expose it. A path dependency with no
# version: nothing here is published, and `deny.toml` already permits a wildcard
# path for exactly this reason.
time_value = { path = "crates/time_value" }

# Argument parsing for the CLI. Earned rather than assumed: the `--rate` /
# `--rate-percent` exclusivity is a rule the parser enforces, and hand-rolling
# it would restate in code what a `[group]` attribute says once.
clap = { version = "4.6", features = ["derive"] }

# Levels are authoritative here; CI adds no `-D warnings`. Every member needs
# `[lints] workspace = true` or it silently gets none of this.
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style   = { level = "deny", priority = -1 }
unused              = { level = "deny", priority = -1 }
let_underscore      = { level = "deny", priority = -1 }
keyword_idents      = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_idioms    = { level = "deny", priority = -1 }

unsafe_code                   = "forbid"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"
unsafe_op_in_unsafe_fn        = "deny"
unfulfilled_lint_expectations = "deny"
trivial_casts                 = "deny"
trivial_numeric_casts         = "deny"
unused_qualifications         = "deny"
unused_lifetimes              = "deny"
unused_import_braces          = "deny"
macro_use_extern_crate        = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
complexity  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }
cargo       = { level = "deny", priority = -1 }
# `restriction` and `nursery` are never enabled as groups — cherry-picks only.

multiple_crate_versions = "allow"

# restriction — panic-freedom
unwrap_used        = "deny"
panic              = "deny"
panic_in_result_fn = "deny"
unwrap_in_result   = "deny"
todo               = "deny"
unimplemented      = "deny"
unreachable        = "deny"
indexing_slicing   = "deny"
get_unwrap         = "deny"
string_slice       = "deny"
exit               = "deny"

# restriction — suppression discipline
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

# restriction — unsafe
undocumented_unsafe_blocks    = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment    = "deny"
unnecessary_safety_doc        = "deny"

# restriction — debug / IO
dbg_macro        = "deny"
print_stdout     = "deny"
print_stderr     = "deny"
filetype_is_file = "deny"

# restriction — silent failure
let_underscore_must_use     = "deny"
unused_result_ok            = "deny"
map_err_ignore              = "deny"
assertions_on_result_states = "deny"

# restriction — footguns, numeric, tests
rc_mutex               = "deny"
mem_forget             = "deny"
iter_over_hash_type    = "deny"
float_cmp_const        = "deny"
lossy_float_literal    = "deny"
missing_assert_message = "deny"
redundant_test_prefix  = "deny"

# nursery cherry-picks
path_buf_push_overwrite    = "deny"
read_zero_byte_vec         = "deny"
fallible_impl_from         = "deny"
debug_assert_with_mut_call = "deny"
collection_is_never_read   = "deny"
needless_collect           = "deny"
or_fun_call                = "deny"
use_self                   = "deny"
equatable_if_let           = "deny"
trivial_regex              = "deny"

# Inert unless CI runs `cargo doc`.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
